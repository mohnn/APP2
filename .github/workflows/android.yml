name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        id: find
        run: |
          P=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: Build web app
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npx cap init "Modern British Kids" com.modernbritishkids.nursery --web-dir dist
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
